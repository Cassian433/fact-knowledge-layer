[project]
name = "factlayer"
version = "0.1.0"
description = "Fact knowledge layer: grounded fact extraction from PDFs with cross-document corroboration, contradiction and reconciliation"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.4.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
